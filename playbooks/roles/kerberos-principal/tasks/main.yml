- name: Check principal
  command: kadmin -q "getprinc {{ user_kerberos_princ_name }}" -p {{ kerberos_admin_principal }} -k -t {{ kerberos_admin_keytab }}
  check_mode: no
  register: target_principals
  changed_when: target_principals.stderr.find('Principal does not exist') != -1

- name: Add principal
  command: kadmin -q "addprinc -randkey {{ user_kerberos_princ_name }}" -p {{ kerberos_admin_principal }} -k -t {{ kerberos_admin_keytab }}
  when: target_principals is defined and target_principals.stderr.find('Principal does not exist') != -1
    
- name: Check keytab
  command: klist -k {{ user_kerberos_princ_keytab_path }}
  register: target_keytabs
  changed_when: target_keytabs.rc != 0 or target_keytabs.stdout.find(user_kerberos_princ_name) == -1
  check_mode: no
  ignore_errors: yes

- name: Prepare keytab
  command: kadmin -q "ktadd -k {{ user_kerberos_princ_keytab_path }} {{ user_kerberos_princ_name }}" -p {{ kerberos_admin_principal }} -k -t {{ kerberos_admin_keytab }}
  when: target_keytabs is defined and target_keytabs.rc != 0 or target_keytabs.stdout.find(user_kerberos_princ_name) == -1
