- name: create_hadoop_conf_dir
  become: yes
  file: path={{ hadoop_conf_dir }} state=directory owner=root group=root mode=755

- name: copy_conf_files
  become: yes
  template: src={{ item }}.j2 dest=/etc/hadoop/conf/{{ item }}
  with_items:
  - core-site.xml
  - hdfs-site.xml
  - yarn-site.xml
  - mapred-site.xml
  - hadoop-env.sh
  - yarn-env.sh
  - mapred-env.sh
  - hadoop-metrics.properties
  - hadoop-metrics2.properties
  - log4j.properties
  - capacity-scheduler.xml
  - hosts.exclude
  - hosts.list
  
- name: copy_secure_conf_files
  become: yes
  template: src={{ item }}.j2 dest=/etc/hadoop/conf/{{ item }}
  with_items:
  - ssl-server.xml
  - ssl-client.xml
  - zk-acl.txt
  - container-executor.cfg
  when: kerberos_realm is defined

- name: Protect externally provisioned HTTPS keystore
  become: yes
  file: path={{ https_keystore_path }} owner=root group=hadoop mode=0440
  when: kerberos_realm is defined

- name: Make public HTTPS trust anchors available to clients
  become: yes
  file: path={{ https_truststore_path }} owner=root group=root mode=0444
  when: kerberos_realm is defined

- name: Protect LinuxContainerExecutor configuration
  become: yes
  file: path=/etc/hadoop/conf/container-executor.cfg owner=root group=yarn mode=0400
  when: kerberos_realm is defined
