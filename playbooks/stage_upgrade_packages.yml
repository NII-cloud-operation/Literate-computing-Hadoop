- name: Stage hadoop without changing current
  hosts: hadoop_all
  become: true
  tags:
  - hadoop
  tasks:
  - name: prepare_upgrade_package_directory
    file:
      path: '{{ hadoop_dir }}/package'
      state: directory
  - name: download_verified_upgrade_package
    get_url:
      url: '{{ hadoop_release_url }}'
      dest: '{{ hadoop_dir }}/package/{{ hadoop_package_filename }}.tar.gz'
      checksum: '{{ hadoop_release_checksum }}'
      owner: root
      group: root
  - name: extract_upgrade_package
    unarchive:
      src: '{{ hadoop_dir }}/package/{{ hadoop_package_filename }}.tar.gz'
      dest: '{{ hadoop_dir }}'
      remote_src: true
      owner: root
      group: root
      creates: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/bin'
  - name: preserve_distribution_configuration
    command:
      cmd: mv hadoop hadoop.backup
      chdir: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/etc'
      creates: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/etc/hadoop.backup'
  - name: remove_distribution_configuration
    file:
      path: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/etc/hadoop'
      state: absent
  - name: use_existing_hadoop_configuration
    file:
      path: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/etc/hadoop'
      src: /etc/hadoop/conf
      state: link
  - name: set_container_executor_permissions
    file:
      path: '{{ hadoop_dir }}/{{ hadoop_package_filename }}/bin/container-executor'
      owner: root
      group: yarn
      mode: '6050'
