- name: Stage jsvc without changing current
  hosts: hadoop_all
  become: true
  tags:
  - jsvc
  tasks:
  - name: prepare_upgrade_package_directory
    file:
      path: '{{ jsvc_dir }}/package'
      state: directory
  - name: download_verified_upgrade_package
    get_url:
      url: '{{ jsvc_release_url }}'
      dest: '{{ jsvc_dir }}/package/{{ jsvc_package_filename }}.tar.gz'
      checksum: '{{ jsvc_release_checksum }}'
      owner: root
      group: root
  - name: extract_upgrade_package
    unarchive:
      src: '{{ jsvc_dir }}/package/{{ jsvc_package_filename }}.tar.gz'
      dest: '{{ jsvc_dir }}'
      remote_src: true
      owner: root
      group: root
      creates: '{{ jsvc_dir }}/{{ jsvc_package_filename }}/src/native/unix/support/buildconf.sh'
  - name: build_upgrade_jsvc
    shell:
      cmd: sh support/buildconf.sh && ./configure --with-java={{ java_home }} && make
      chdir: '{{ jsvc_dir }}/{{ jsvc_package_filename }}/src/native/unix'
      creates: '{{ jsvc_dir }}/{{ jsvc_package_filename }}/src/native/unix/jsvc'
