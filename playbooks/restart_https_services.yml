- hosts: hadoop_journalnode
  serial: 1
  become: yes
  tasks:
    - name: Restart JournalNode
      service: name=hadoop-hdfs-journalnode state=restarted

    - name: Wait for JournalNode RPC
      wait_for:
        host: "{{ ansible_fqdn }}"
        port: 8485
        timeout: 120

    - name: Wait for JournalNode HTTPS
      wait_for:
        host: "{{ ansible_fqdn }}"
        port: 8481
        timeout: 120

    - name: Resume journal writes in a new segment
      become_user: hdfs
      command: hdfs dfsadmin -rollEdits

- hosts: hadoop_namenode
  serial: 1
  become: yes
  tasks:
    - name: Stop failover controller
      service: name=hadoop-hdfs-zkfc state=stopped
      when: hadoop_namenode_servers|length > 1

    - name: Restart NameNode
      service: name=hadoop-hdfs-namenode state=restarted

    - name: Wait for NameNode RPC
      wait_for:
        host: "{{ ansible_fqdn }}"
        port: "{{ namenode_rpc_port }}"
        timeout: 120

    - name: Start failover controller
      service: name=hadoop-hdfs-zkfc state=started
      when: hadoop_namenode_servers|length > 1

    - name: Wait for NameNode HTTPS
      wait_for:
        host: "{{ ansible_fqdn }}"
        port: "{{ namenode_https_port }}"
        timeout: 120

