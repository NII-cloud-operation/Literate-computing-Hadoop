name: Hadoop notebook integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notebook-integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  notebook-integration:
    name: Hadoop notebooks (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: basic
            authentication: simple
          - variant: security
            authentication: kerberos
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      HADOOP_SECURITY_MODE: ${{ matrix.authentication }}
      HDFS_E2E_PACKAGE_CACHE: ${{ github.workspace }}/.hdfs-package-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: tests/lc4ri/requirements.txt
      - name: Verify notebook sources
        run: git diff --exit-code HEAD -- '*.ipynb'
      - name: Install browser and VM prerequisites
        run: |
          python -m pip install -r tests/lc4ri/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils curl default-jre-headless ffmpeg fonts-dejavu-core fonts-noto-cjk
          install -Dm644 tests/lc4ri/fonts.conf ~/.config/fontconfig/fonts.conf
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 8G /swapfile-notebook-ci
          sudo chmod 600 /swapfile-notebook-ci
          sudo mkswap /swapfile-notebook-ci
          sudo swapon /swapfile-notebook-ci
          free -h
      - uses: actions/cache/restore@v4
        id: packages
        with:
          path: ${{ github.workspace }}/.hdfs-package-cache
          key: notebook-archives-apache-v1-${{ hashFiles('playbooks/group_vars/all/hadoop', 'playbooks/group_vars/all/zookeeper_server', 'playbooks/group_vars/all/spark', 'playbooks/group_vars/all/hbase') }}
          restore-keys: notebook-archives-apache-v1-
      - name: Run notebooks through the browser
        run: bash tests/lc4ri/run.sh
      - name: Render notebook videos
        if: always()
        run: |
          if test -f test-results/notebook-integration/video-manifest.json; then
            python tests/lc4ri/render_movie.py --result-dir test-results/notebook-integration --variant ${{ matrix.variant }}
          else
            echo 'No video manifest; browser execution did not start.'
          fi
      - name: Check verified package cache
        id: verified
        if: always()
        run: |
          if test -f "$HDFS_E2E_PACKAGE_CACHE/.verified"; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.verified.outputs.complete == 'true' && steps.packages.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.hdfs-package-cache
          key: notebook-archives-apache-v1-${{ hashFiles('playbooks/group_vars/all/hadoop', 'playbooks/group_vars/all/zookeeper_server', 'playbooks/group_vars/all/spark', 'playbooks/group_vars/all/hbase') }}
      - name: Verify notebook sources after execution
        if: always()
        run: git diff --exit-code HEAD -- '*.ipynb'
      - name: Upload notebook results without browser trace or video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-results-${{ matrix.variant }}
          path: |
            test-results/notebook-integration/*.json
            test-results/notebook-integration/*-working.ipynb
            test-results/notebook-integration/*.png
          retention-days: 14
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-logs-${{ matrix.variant }}
          path: |
            test-results/notebook-integration/*.log
            test-results/notebook-integration/*.txt
            test-results/notebook-integration/*.tar.gz
            test-results/notebook-integration/lc-logs/
            test-results/notebook-integration/inventory
            test-results/notebook-integration/group_vars/
          retention-days: 14
      - name: Upload browser trace
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-trace-${{ matrix.variant }}
          path: test-results/notebook-integration/browser-trace.zip
          retention-days: 14
      - name: Upload D00 video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-D00
          path: |
            test-results/notebook-integration/movies/D00.mp4
            test-results/notebook-integration/videos/D00/
          retention-days: 14
      - name: Upload D10 video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-D10
          path: |
            test-results/notebook-integration/movies/D10.mp4
            test-results/notebook-integration/videos/D10/
          retention-days: 14
      - name: Upload D12 video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-D12
          path: |
            test-results/notebook-integration/movies/D12.mp4
            test-results/notebook-integration/videos/D12/
          retention-days: 14
      - name: Upload T12a video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-T12a
          path: |
            test-results/notebook-integration/movies/T12a.mp4
            test-results/notebook-integration/videos/T12a/
          retention-days: 14
      - name: Upload T12d video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-T12d
          path: |
            test-results/notebook-integration/movies/T12d.mp4
            test-results/notebook-integration/videos/T12d/
          retention-days: 14
      - name: Upload combined movie
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-video-${{ matrix.variant }}-combined
          path: test-results/notebook-integration/movies/notebooks-${{ matrix.variant }}.mp4
          retention-days: 14
